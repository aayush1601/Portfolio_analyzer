# Phase 16: every pull request and every push to main is linted, tested and built. deploy.yml reuses this
# workflow as its first job, so nothing reaches AWS without passing it.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by deploy.yml, which runs this workflow before deploying
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # tsc -b, then vite build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure
      - name: validate
        run: |
          for root in infrastructure/bootstrap infrastructure/environments; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
