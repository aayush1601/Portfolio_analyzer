# Recommendation engine (FR7). Design assumptions, to be tuned in the backtest/ablation, not ground truth.
# Bump `version` whenever anything changes; it is returned with every recommendation.
version: v1-basic
disclaimer: Hypothetical, for research; not financial advice.

# Component scores are 0-100, higher = more attractive to hold or add. final_score is their weighted mean
# over the components that exist. expected_return has no weight until the Phase 9 model exists.
weights: { expected_return: 0.0, news: 0.35, risk: 0.30, portfolio_fit: 0.35 }
thresholds: { buy: 65, reduce: 35 }  # ≥ buy → BUY/INCREASE, ≤ reduce → REDUCE, else HOLD
# BUY/INCREASE needs at least this many scored components; with less evidence the action is capped at HOLD.
min_components_to_add: 2

# Safety rules: above a cap → REDUCE; at or above a cap → never BUY/INCREASE (effective, look-through weights).
caps: { company: 0.15, sector: 0.25 }

risk_volatility: { low: 0.10, high: 0.50 }  # 1y annualised vol → risk score 100 … 0
news_evidence_k: 1.0  # sentiment shrinks toward 0 as weight/(weight + k): one fresh confident article ≈ half strength
switch_overlap: 0.5  # a fund overlapping ≥ 50% with another held fund is a SWITCH candidate
