[project]
name = "portfolio-intelligence-backend"
version = "0.1.0"
description = "Multi-asset portfolio risk & financial intelligence backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    "yfinance>=1.7.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "casparser>=1.4.1",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "scipy>=1.18.1",
    "mangum>=0.22.0",
    "boto3>=1.43.108",
]

[dependency-groups]
dev = [
    "moto[dynamodb,events,s3,sns,sqs]>=5.2.3",
    "pytest>=8",
    "ruff>=0.6",
]
ml = [
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "xgboost>=3.4.1",
]
# Phase 0 feasibility spike only (yfinance/pandas became main deps in Phase 2).
spikes = ["requests>=2.32"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/services/ml.py" = ["E501"]  # markdown model-card template
"app/services/backtest.py" = ["E501"]  # markdown report template
"app/aws/handlers.py" = ["E501"]
