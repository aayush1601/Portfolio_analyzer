[project]
name = "portfolio-intelligence-backend"
version = "0.1.0"
description = "Multi-asset portfolio risk & financial intelligence backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    "yfinance>=1.7.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Phase 0 feasibility spike only (yfinance/pandas became main deps in Phase 2).
spikes = ["requests>=2.32"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
